name: 资金热度选股

on:
  schedule:
    - cron: '25 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: alphasift-03-capital-heat
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 同步上游代码
        run: |
          gh repo sync ${{ github.repository }} --source ZhuLinsen/alphasift
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 执行选股 - 资金热度
        id: screen
        run: |
          # 运行选股
          alphasift screen capital_heat --no-llm 2> >(tee /tmp/alphasift_err.log >&2) | tee /tmp/result.json

      - name: 格式化结果摘要
        if: success()
        run: |
          echo "=== 资金热度选股结果 ==="
          echo ""
          python3 -c "
import json
with open('/tmp/result.json') as f:
    data = json.load(f)
picks = data.get('picks', data) if isinstance(data, dict) else data
if isinstance(picks, list):
    print(f'共筛选出 {len(picks)} 只候选股\n')
    for p in picks:
        code = p.get('code','?')
        name = p.get('name','?')
        score = p.get('final_score', p.get('score', 0))
        price = p.get('price', 0)
        chg = p.get('change_pct', 0)
        vol = p.get('volume_ratio', 0)
        industry = p.get('industry', '')
        print(f'  {code} {name} 评分:{score:.1f}  现价:{price:.2f}  涨幅:{chg:+.1f}%  量比:{vol:.1f}  {industry}')
else:
    print('选股完成，请查看 artifacts 中的完整结果')
" 2>/dev/null || cat /tmp/result.json

      - name: 上传完整结果
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: alphasift-03-capital-heat-${{ github.run_number }}
          path: /tmp/result.json
          retention-days: 7
