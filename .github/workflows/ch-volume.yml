name: 放量突破选股
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e .
      - run: >
          TUSHARE_TOKEN=${{ secrets.TUSHARE_TOKEN }}
          alphasift screen volume_breakout --no-llm 2>/tmp/err.log | tee /tmp/result.json
      - name: 推送到 Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%m-%d %H:%M')
          &&
          python3 -c "import json,os; d=json.load(open('/tmp/result.json')); picks=d.get('picks',d) if isinstance(d,dict) else d;
          lines=['共筛选出 '+str(len(picks))+' 只候选股',''];
          [lines.append(f\\"{p.get('code','?')} {p.get('name','?')} 评分:{p.get('final_score',p.get('score',0)):.1f} 涨幅:{p.get('change_pct',0):+.1f}%\\") for p in (picks[:10] if isinstance(picks,list) else [])];
          msg='<b>放量突破选股 '+os.environ['TIMESTAMP']+'</b>\n\n'+'\n'.join(lines);
          open('/tmp/tg_msg.txt','w').write(msg)" 2>&1
          &&
          curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d "chat_id=$TG_CHAT" -d "parse_mode=HTML" --data-urlencode "text@/tmp/tg_msg.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: volume_breakout-result
          path: /tmp/result.json
          retention-days: 7
