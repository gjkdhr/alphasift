name: 资金热度选股
on:
  schedule:
    - cron: '35 6 * * 1-5'
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - run: echo "start"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e .
      - run: TUSHARE_TOKEN=${{ secrets.TUSHARE_TOKEN }} alphasift screen capital_heat --no-llm 2>/tmp/err.log | tee /tmp/result.json
      - name: push to telegram
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%m-%d %H:%M')
          RESULT=$(python3 -c "
import json
with open('/tmp/result.json') as f:
    data = json.load(f)
picks = data.get('picks', data) if isinstance(data, dict) else data
if isinstance(picks, list):
    lines = ['共筛选出 ' + str(len(picks)) + ' 只候选股', '']
    for p in picks[:10]:
        code = p.get('code','?')
        name = p.get('name','?')
        score = p.get('final_score', p.get('score', 0))
        chg = p.get('change_pct', 0)
        lines.append(f'{code} {name} 评分:{score:.1f} 涨幅:{chg:+.1f}%')
    print('\\n'.join(lines))
" 2>/dev/null) && \
curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
  -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
  -d "parse_mode=HTML" \
  --data-urlencode "text=<b>📊 资金热度 $TIMESTAMP</b>

$RESULT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: capital-heat-result
          path: /tmp/result.json
          retention-days: 7
