name: 资金热度选股
on: workflow_dispatch
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e .
      - run: TUSHARE_TOKEN=${{ secrets.TUSHARE_TOKEN }} alphasift screen capital_heat --no-llm 2>/tmp/err.log | tee /tmp/result.json
      - name: 推送到 Telegram
        run: >
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%m-%d %H:%M')
          &&
          python3 -c "import json; d=json.load(open('/tmp/result.json')); picks=d.get('picks',d) if isinstance(d,dict) else d;
          lines=['共筛选出 '+str(len(picks))+' 只候选股',''];
          [lines.append(f\"{p.get('code','?')} {p.get('name','?')} 评分:{p.get('final_score',p.get('score',0)):.1f} 涨幅:{p.get('change_pct',0):+.1f}%\") for p in (picks[:10] if isinstance(picks,list) else [])];
          open('/tmp/tg_msg.txt','w').write('<b>资金热度选股 '+TIMESTAMP+'</b>\n\n'+'\n'.join(lines))"
          &&
          MSG=$(cat /tmp/tg_msg.txt)
          &&
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -d "parse_mode=HTML" --data-urlencode "text=$MSG"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: capital_heat-result
          path: /tmp/result.json
          retention-days: 7
