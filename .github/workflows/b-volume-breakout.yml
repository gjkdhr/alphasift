name: 放量突破

on:
  workflow_dispatch:

  schedule:
    - cron: '35 6 * * 1-5'

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装
        run: |
          pip install -e .

      - name: 放量突破
        run: alphasift screen volume_breakout --no-llm
