name: 缩量回踩选股
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1-5'
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: 同步上游代码
        run: gh repo sync ${{ github.repository }} --source ZhuLinsen/alphasift
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e .
      - run: TUSHARE_TOKEN=${{ secrets.TUSHARE_TOKEN }} alphasift screen shrink_pullback --no-llm 2>/tmp/err.log | tee /tmp/result.json
      - name: 格式化结果并推送 Telegram
        run: |
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%m-%d %H:%M')
          python3 << "INNERPY"
import json, os
with open('/tmp/result.json') as f:
    data = json.load(f)
picks = data.get('picks', data) if isinstance(data, dict) else data
if isinstance(picks, list):
    lines = [f'共筛选出 {len(picks)} 只候选股', '']
    for p in picks[:10]:
        code = p.get('code','?')
        name = p.get('name','?')
        score = p.get('final_score', p.get('score', 0))
        chg = p.get('change_pct', 0)
        lines.append(f'{code} {name} 评分:{score:.1f} 涨幅:{chg:+.1f}%')
    msg = '<b>缩量回踩选股 ' + TIMESTAMP + '</b>\n\n' + '\n'.join(lines)
    with open('/tmp/tg_msg.txt', 'w') as f:
        f.write(msg)
INNERPY
          MSG=$(cat /tmp/tg_msg.txt)
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=$MSG"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shrink_pullback-result
          path: /tmp/result.json
          retention-days: 7